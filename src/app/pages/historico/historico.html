<div class="container">
  <a class="voltar" routerLink="/gerenciador">‹ Gerenciador</a>
  <h1>Histórico de vendas</h1>

  <div class="barra-filtro">
    <div class="campo-comprador">
      <label for="filtro-comprador">Comprador</label>
      <div class="caixa-select">
        <select id="filtro-comprador" [(ngModel)]="compradorFiltro">
          <option [ngValue]="''">Todos os compradores</option>
          @for (comprador of compradores; track comprador.id) {
            <option [ngValue]="comprador.id">{{ comprador.nome }}</option>
          }
        </select>
      </div>
    </div>

    <!-- os dois indicadores existem sempre, mesmo zerados: some-los quando não
         há valor fazia a barra pular de altura a cada filtro aplicado -->
    <div class="indicadores">
      <div class="indicador">
        <span class="rotulo">Vendas</span>
        <strong class="valor">{{ vendasFiltradas.length }}</strong>
      </div>

      <div class="indicador" [class.tem-aberto]="totalEmAberto > 0">
        <span class="rotulo">A receber</span>
        <strong class="valor">R$ {{ aReceber }}</strong>
      </div>
    </div>
  </div>

  @if (carregando) {
    <p class="aviso">Carregando vendas...</p>
  }

  @for (venda of vendasFiltradas; track venda.id) {
    <app-card-salvo
      [infos]="venda"
      (apagarVenda)="apagar($event)"
      (editarVenda)="editarVenda($event)"
      (alternarPago)="alternarPago($event)"
      class="card-salvo"
    >
    </app-card-salvo>
  }

  @if (!carregando && vendasFiltradas.length === 0) {
    <p class="aviso">Nenhuma venda para esse filtro.</p>
  }

  <div *ngIf="Editando !== null" class="overlay" (click)="fechar()">
    <div class="editarCentral" (click)="$event.stopPropagation()">
      <app-update-venda
        [venda]="Editando"
        (cancela)="fechar()"
        (salva)="atualizarVenda($event)"
      ></app-update-venda>
    </div>
  </div>
</div>
