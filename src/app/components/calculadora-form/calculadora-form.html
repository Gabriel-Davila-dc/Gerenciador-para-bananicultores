<div class="container">
  <div class="calculos">
    @if (vendaInicial) {
      <h2 class="titulo-edicao">Editar venda</h2>
    }

    <label class="campo-bananal">
      Data
      <input type="date" class="input-data" [(ngModel)]="dataISO" name="data" />
    </label>

    <!-- Primeiros filtros -->
    <app-btn-filtro
      [modelo]="1"
      [selecionado]="negocioInicial"
      (filtroEscolhido)="setFiltroNegocio($event)"
    ></app-btn-filtro>

    <app-btn-filtro [modelo]="2" (filtroEscolhido)="setFiltroPeso($event)"></app-btn-filtro>

    <!-- ✅ se for simples -->
    <ng-container *ngIf="filtroNegocio === 'Simples'">
      <app-input-filtro
        [inputFiltro]="filtroPeso === 'Caixa' ? inputPrecoCaixa : inputPrecoQuilo"
        [valores]="valores"
        (valoresEscolhidos)="setValores($event, 'simples')"
      ></app-input-filtro>
    </ng-container>

    <!-- ✅ se for classificada -->
    <ng-container *ngIf="filtroNegocio === 'Classificada'">
      <div class="tela-grande">
        <app-input-filtro
          [inputFiltro]="filtroPeso === 'Caixa' ? inputPrecoCaixa : inputPrecoQuilo"
          [qualidade]="'boa'"
          [valores]="valoresBoa"
          (valoresEscolhidos)="setValores($event, 'boa')"
        ></app-input-filtro>
        <app-input-filtro
          [inputFiltro]="filtroPeso === 'Caixa' ? inputPrecoCaixa : inputPrecoQuilo"
          [qualidade]="'fraca'"
          [valores]="valoresFraca"
          (valoresEscolhidos)="setValores($event, 'fraca')"
        ></app-input-filtro>
      </div>
    </ng-container>

    <!-- ✅ se for classificada: mostrar resultados extras -->
    <ng-container *ngIf="filtroNegocio === 'Classificada'">
      <h3>Resultados classificados:</h3>
      <div class="tela-grande">
        <app-results
          [inputFiltro]="filtroPeso === 'Caixa' ? inputPrecoCaixa : inputPrecoQuilo"
          [qualidade]="'boa'"
          [resultados]="resultadosBoa"
        ></app-results>

        <app-results
          [inputFiltro]="filtroPeso === 'Caixa' ? inputPrecoCaixa : inputPrecoQuilo"
          [qualidade]="'fraca'"
          [resultados]="resultadosFraca"
        ></app-results>
      </div>
    </ng-container>

    <!-- ✅ resultado geral sempre visível -->
    <h3>resultado:</h3>
    <app-results
      [inputFiltro]="filtroPeso === 'Caixa' ? inputPrecoCaixa : inputPrecoQuilo"
      [resultados]="resultados"
    ></app-results>

    <!-- Comprador cadastrado: liga a venda a ele e dá o nome que vai para o histórico -->
    <label class="campo-bananal">
      Comprador
      <app-seletor titulo="Comprador" [opcoes]="opcoesComprador" [(ngModel)]="compradorId" />
    </label>

    <!-- De qual bananal saiu essa venda -->
    <label class="campo-bananal">
      Bananal
      <app-seletor titulo="Bananal" [opcoes]="opcoesBananal" [(ngModel)]="bananal" />
    </label>

    <div class="acoes">
      <button mat-raised-button id="button" (click)="salvar()">
        <mat-icon class="truck-icon" *ngIf="moverCaminhao">local_shipping</mat-icon>
        <label for="">{{ textoBotao }}</label>
      </button>

      @if (vendaInicial) {
        <button
          mat-stroked-button
          type="button"
          class="botao-cancelar"
          (click)="cancelar()"
        >
          Cancelar
        </button>
      }
    </div>
  </div>
</div>
