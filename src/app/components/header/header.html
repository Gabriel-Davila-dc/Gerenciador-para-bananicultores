<!-- HEADER COM IMAGEM -->
<header id="header">
  <div class="logo">
    <img src="/img/banana.transparente.png" alt="" />
    <h1>Calculadora de Banana</h1>
  </div>
  <nav>
    <div id="burg" (click)="showMenu()">☰</div>
    <ul id="menus">
      <li><a routerLink="/">Início</a></li>
      <li><a routerLink="/gerenciador">Gerenciador</a></li>
      <li><a routerLink="/sobre">Infos</a></li>
      <li *ngIf="!logado"><a routerLink="/login">Entrar</a></li>
      <li *ngIf="logado"><a (click)="sair()">Sair</a></li>
    </ul>
  </nav>
</header>
<nav id="nav-mobile">
  <ul [id]="menusMobile" (click)="noShowMenu()">
    <li><a routerLink="/">Início</a></li>
    <li><a routerLink="/gerenciador">Gerenciador</a></li>
    <li><a routerLink="/sobre">Sobre</a></li>
    <li *ngIf="!logado"><a routerLink="/login">Entrar</a></li>
    <li *ngIf="logado"><a (click)="sair()">Sair</a></li>
  </ul>
</nav>
